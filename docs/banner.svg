<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Cards: your physical cards on your phone. Offline, encrypted, no account.">
  <style>
    .bg { fill: #F4F5F7; }
    .title { fill: #111318; }
    .sub { fill: #5B6170; }
    .chip { fill: #E6E5FC; }
    .chiptext { fill: #3730A3; }
    .c1 { fill: #4F46E5; }
    .c2 { fill: #0E9384; }
    .c3 { fill: #F79009; }
    .stripe { fill: #FFFFFF; opacity: 0.85; }
    .chipgold { fill: #FDE68A; }
    .lock { fill: #111318; }
    .lockbody { fill: #FFFFFF; }
    .shackle { stroke: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B0D12; }
      .title { fill: #F3F4F7; }
      .sub { fill: #A1A7B4; }
      .chip { fill: #24224A; }
      .chiptext { fill: #C7C4FF; }
      .c1 { fill: #6366F1; }
      .lock { fill: #F3F4F7; }
      .lockbody { fill: #0B0D12; }
      .shackle { stroke: #0B0D12; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect class="bg" width="1200" height="360" rx="28"/>
  <!-- a fanned stack of three ID-1 shaped cards (85.6 x 54 ratio) -->
  <g transform="translate(50 95)">
    <g transform="rotate(-14 120 120)"><rect class="c3" x="20" y="40" width="214" height="135" rx="14"/></g>
    <g transform="rotate(-5 120 120)"><rect class="c2" x="30" y="45" width="214" height="135" rx="14"/></g>
    <g transform="rotate(5 120 120)">
      <rect class="c1" x="40" y="50" width="214" height="135" rx="14"/>
      <rect class="chipgold" x="62" y="88" width="34" height="26" rx="5"/>
      <rect class="stripe" x="62" y="140" width="120" height="10" rx="5"/>
      <rect class="stripe" x="62" y="158" width="70" height="8" rx="4" opacity="0.6"/>
    </g>
    <!-- padlock badge -->
    <g transform="translate(222 150)">
      <circle class="lock" r="34"/>
      <path d="M-10 -4 v-8 a10 10 0 0 1 20 0 v8" fill="none" stroke-width="5" class="shackle"/>
      <rect class="lockbody" x="-15" y="-5" width="30" height="22" rx="4"/>
    </g>
  </g>
  <text class="title" x="380" y="150" font-size="72" font-weight="700" letter-spacing="-1.5">Cards</text>
  <text class="sub" x="382" y="198" font-size="27">Your physical cards on your phone. Private by design.</text>
  <g font-size="20" font-weight="600">
    <rect class="chip" x="382" y="236" width="150" height="44" rx="22"/>
    <text class="chiptext" x="457" y="265" text-anchor="middle">100% offline</text>
    <rect class="chip" x="546" y="236" width="146" height="44" rx="22"/>
    <text class="chiptext" x="619" y="265" text-anchor="middle">No account</text>
    <rect class="chip" x="706" y="236" width="136" height="44" rx="22"/>
    <text class="chiptext" x="774" y="265" text-anchor="middle">Encrypted</text>
    <rect class="chip" x="856" y="236" width="146" height="44" rx="22"/>
    <text class="chiptext" x="929" y="265" text-anchor="middle">No tracking</text>
    <rect class="chip" x="1016" y="236" width="150" height="44" rx="22"/>
    <text class="chiptext" x="1091" y="265" text-anchor="middle">Open source</text>
  </g>
</svg>
